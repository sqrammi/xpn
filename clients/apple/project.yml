name: XPN
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 4
    DEAD_CODE_STRIPPING: YES
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: YOUR_APPLE_TEAM_ID
    XPN_SHARED_GROUP: com.example.xpn.shared
    HEADER_SEARCH_PATHS: $(SRCROOT)/../../native/include
    SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Shared/Bridge.h
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targetTemplates:
  App:
    type: application
    sources: [App, Shared, Resources, AppResources]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/${target_name}-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: XPN
        NSCameraUsageDescription: Scan your one-time XPN VPN invitation.
        XPNKeychainGroup: $(AppIdentifierPrefix)$(XPN_SHARED_GROUP)
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
    entitlements:
      path: Generated/${target_name}.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        keychain-access-groups: [$(AppIdentifierPrefix)$(XPN_SHARED_GROUP)]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - framework: Frameworks/XPNNative.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: libz.tbd
      - sdk: libresolv.tbd
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
  Tunnel:
    type: app-extension
    sources: [Tunnel, Shared, Resources, TunnelResources]
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/${target_name}-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: XPN Tunnel
        XPNKeychainGroup: $(AppIdentifierPrefix)$(XPN_SHARED_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Generated/${target_name}.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        keychain-access-groups: [$(AppIdentifierPrefix)$(XPN_SHARED_GROUP)]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    dependencies:
      - framework: Frameworks/XPNNative.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: libz.tbd
      - sdk: libresolv.tbd
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
targets:
  XPN-iOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xpn.ios
    info:
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: XPN-iOS-Tunnel
        embed: true
  XPN-iOS-Tunnel:
    templates: [Tunnel]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xpn.ios.tunnel
  XPN-macOS:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xpn.macos
    dependencies:
      - target: XPN-macOS-Tunnel
        embed: true
  XPN-macOS-Tunnel:
    templates: [Tunnel]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xpn.macos.tunnel
