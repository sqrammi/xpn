# Include in the nginx http {} block. Replace hostname and certificate paths.
map $http_upgrade $xpn_connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=xpn_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=xpn_connections:10m;

server {
    listen 443 ssl;
    server_name vpn.example.com;
    ssl_certificate /etc/letsencrypt/live/vpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.example.com/privkey.pem;
    ssl_protocols TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8k;

    # Keep /xpn in the upstream URI. PUBLIC_URL=https://vpn.example.com/xpn
    location = /xpn { return 308 /xpn/; }
    location = /xpn/vpn {
        limit_conn xpn_connections 8;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xpn_connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location /xpn/ {
        limit_req zone=xpn_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
    # Other reverse-proxied services can have their own locations here.
}
