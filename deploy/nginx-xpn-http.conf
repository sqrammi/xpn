# Include ONCE inside nginx's http {} context (usually /etc/nginx/conf.d/).
# Do not also load the corresponding directives from deploy/nginx.conf.
map $http_upgrade $xpn_connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=xpn_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=xpn_connections:10m;
