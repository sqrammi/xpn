# Include inside the EXISTING HTTPS server {} for alta.jeffhansen.com.
# Its current certificate, listeners and other locations stay in that server.
# PUBLIC_URL=https://alta.jeffhansen.com/xpn
location = /xpn { return 308 /xpn/; }

location = /xpn/vpn {
    client_max_body_size 8k;
    limit_conn xpn_connections 8;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xpn_connection_upgrade;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}

# ^~ keeps existing regex locations (e.g. for .js or .css) from taking XPN assets.
location ^~ /xpn/ {
    client_max_body_size 8k;
    limit_req zone=xpn_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
}
